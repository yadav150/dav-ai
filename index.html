<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dav AI</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Universal loader -->
  <div id="global-loader" class="loader-overlay">
    <div class="spinner"></div>
  </div>

  <!-- App root -->
  <div id="app" class="app hidden">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <span class="brand">Dav AI</span>
        <button id="new-chat-btn" class="btn-new-chat">New Chat</button>
      </div>
      <div id="chat-list" class="chat-list"></div>
      <div class="sidebar-footer">
        <button id="settings-btn" class="btn-settings">Settings</button>
        <div id="profile-card" class="profile-card"></div>
      </div>
    </aside>

    <!-- Main area -->
    <main class="main">
      <header class="header">
        <button id="menu-toggle" class="menu-toggle" aria-label="Toggle sidebar">☰</button>
        <h1 id="chat-title" class="chat-title">New Chat</h1>
      </header>
      <div id="chat-messages" class="chat-messages"></div>
      <div class="input-bar">
        <textarea id="user-input" class="user-input" placeholder="Type a message..." rows="1"></textarea>
        <button id="send-btn" class="send-btn">Send</button>
        <button id="stop-btn" class="stop-btn hidden">Stop</button>
      </div>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
