<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1c2732">
<title>DavAI</title>
<link rel="stylesheet" href="chat.css">
</head>

<body>

<!-- SIDEBAR DRAWER -->
<aside class="sidebar" id="sidebar">

    <div class="sidebar-head">
        <div class="sidebar-brand">DavAI</div>
        <button class="sidebar-close" id="sidebarClose" type="button" aria-label="Close menu">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
        </button>
    </div>

    <button class="new-chat" id="newChatBtn" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
        </svg>
        <span>New Chat</span>
    </button>

    <div class="sidebar-label">Recent</div>

    <div class="chat-history" id="chatHistory"></div>

    <div class="sidebar-foot">
        <button class="sidebar-action" id="settingsBtn" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            <span>Settings</span>
        </button>

        <button class="sidebar-action profile-action" id="profileBtn" type="button">
            <div class="avatar" id="avatarSmall">U</div>
            <div class="profile-info">
                <div class="profile-name" id="profileNameSmall">User</div>
                <div class="profile-email" id="profileEmailSmall"></div>
            </div>
        </button>
    </div>

</aside>

<div class="sidebar-scrim" id="sidebarScrim"></div>


<!-- MAIN APP -->
<div class="app" id="app">

    <header class="header">
        <button class="icon-btn" id="menuBtn" type="button" aria-label="Menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M3 6h18M3 12h18M3 18h18"/>
            </svg>
        </button>

        <div class="brand">
            <img class="brand-logo" src="assets/logo.png" alt="DavAI">
            <span class="online-dot" aria-hidden="true"></span>
        </div>

        <button class="icon-btn profile-btn" id="profileBtnTop" type="button" aria-label="Profile">
            <div class="avatar avatar-sm" id="avatarTop">U</div>
        </button>
    </header>


    <main class="chat-area" id="chatArea">
        <div class="messages" id="messages">

            <div class="welcome" id="welcome">
                <div class="welcome-inner">
                    <img class="welcome-logo" src="assets/logo.png" alt="DavAI">
                    <h1>Hi, I'm DavAI.</h1>
                    <p>Ask me anything — from current affairs to code, careers, and clear explanations.</p>
                </div>
            </div>

        </div>

        <div class="thinking" id="thinking">
            <div class="thinking-pill">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="thinking-label" id="thinkingLabel">DavAI is thinking…</span>
            </div>
        </div>

    </main>


    <div class="composer">
        <textarea
            id="messageInput"
            class="message-input"
            placeholder="Message DavAI…"
            rows="1"
        ></textarea>

        <button id="stopBtn" class="stop-btn" type="button" aria-label="Stop" hidden>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                <rect x="6" y="6" width="12" height="12" rx="2"/>
            </svg>
        </button>

        <button id="sendBtn" class="send-btn" type="button" disabled aria-label="Send">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19V5M5 12l7-7 7 7"/>
            </svg>
        </button>
    </div>

</div>


<!-- CHAT KEBAB MENU -->
<div class="chat-menu" id="chatMenu">
    <button id="deleteChatBtn" type="button">Delete chat</button>
</div>


<!-- SETTINGS OVERLAY -->
<div class="settings-overlay" id="settingsOverlay">
    <div class="settings-panel">

        <div class="settings-header">
            <h2>Settings</h2>
            <button class="close-settings" id="closeSettings" type="button" aria-label="Close">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <div class="settings-content">

            <div class="profile-card">
                <div class="large-avatar" id="avatarLarge" role="button" tabindex="0">U</div>
                <div class="profile-details">
                    <h3 id="profileNameLarge">User</h3>
                    <p id="profileEmailLarge"></p>
                    <button class="change-picture-btn" id="changePictureBtn" type="button">Change picture</button>
                </div>
                <input type="file" id="avatarInput" accept="image/png,image/jpeg,image/webp" hidden>
            </div>

            <div class="setting-section">
                <div class="setting-section-title">Account</div>
                <div class="setting-row">
                    <span>Name</span>
                    <span class="setting-value" id="accountName">User</span>
                </div>
                <div class="setting-row">
                    <span>Email</span>
                    <span class="setting-value" id="accountEmail"></span>
                </div>
            </div>

                        <div class="setting-section">
                <div class="setting-section-title">Preferences</div>

                <div class="setting-row">
                    <span>Language</span>
                    <select class="setting-select" id="prefLanguage">
                        <option value="auto">Auto (mirror me)</option>
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <option value="hi-en">Hinglish</option>
                    </select>
                </div>

                <div class="setting-row">
                    <span>Response style</span>
                    <select class="setting-select" id="prefStyle">
                        <option value="balanced">Balanced</option>
                        <option value="concise">Concise</option>
                        <option value="detailed">Detailed</option>
                        <option value="exam">Exam-focused</option>
                    </select>
                </div>

                <div class="setting-row">
                    <span>Response length</span>
                    <select class="setting-select" id="prefLength">
                        <option value="medium">Medium</option>
                        <option value="short">Short</option>
                        <option value="long">Long</option>
                    </select>
                </div>
            </div>

            <button class="logout-button" id="logoutBtn" type="button">Log out</button>

        </div>

        <div class="upload-overlay" id="uploadOverlay">
            <div class="upload-box">
                <div class="upload-label" id="uploadLabel">Uploading…</div>
                <div class="upload-track"><div class="upload-bar" id="uploadBar"></div></div>
            </div>
        </div>

    </div>
</div>


<!-- LOGOUT CONFIRM -->
<div class="logout-modal" id="logoutModal">
    <div class="logout-box">
        <h3>Log out?</h3>
        <p>You will be signed out of DavAI on this device.</p>
        <div class="logout-actions">
            <button class="cancel-logout" id="cancelLogout" type="button">Cancel</button>
            <button class="confirm-logout" id="confirmLogout" type="button">Log out</button>
        </div>
    </div>
</div>


<script type="module" src="js/chat.js"></script>

</body>
</html>
