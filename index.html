<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Dav AI — an AI chatbot platform." />
  <title>Dav AI</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>Dav AI</h1>
      <div id="user-info" class="user-info" aria-live="polite"></div>
    </header>

    <main class="chat-panel" aria-label="Chat">
      <div id="messages" class="messages" aria-live="polite" aria-relevant="additions"></div>
      <div id="empty-state" class="empty-state">
        <p>Sign in to start chatting with Dav AI.</p>
      </div>
    </main>

    <footer class="composer">
      <form id="chat-form" autocomplete="off">
        <label for="chat-input" class="visually-hidden">Message</label>
        <input
          id="chat-input"
          type="text"
          placeholder="Type a message…"
          disabled
          aria-label="Chat message input"
        />
        <button id="send-btn" type="submit" disabled>Send</button>
      </form>
      <p id="status" class="status" role="status"></p>
    </footer>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
